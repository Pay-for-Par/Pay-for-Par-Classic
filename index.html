<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c2f">
  <meta name="description" content="Pay to Par — The score you'll tell everyone you shot anyway.">
  <title>Pay to Par</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/main.css?v=4.3">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" data-route="home" aria-label="Home">
        <span aria-hidden="true">⌂</span>
      </button>

      <div class="brand-mini">
        <span class="brand-mini__mark">P2P</span>
        <span class="brand-mini__name">PAY TO PAR</span>
      </div>

      <button class="icon-button" data-route="rules" aria-label="Rules and glossary">
        <span aria-hidden="true">?</span>
      </button>
    </header>

    <main id="app" class="page-wrap" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="home" class="nav-item active">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span>Home</span>
      </button>
      <button data-route="new-round" class="nav-item">
        <span class="nav-icon" aria-hidden="true">＋</span>
        <span>New Round</span>
      </button>
      <button data-route="rules" class="nav-item">
        <span class="nav-icon" aria-hidden="true">♧</span>
        <span>Rules</span>
      </button>
      <button data-route="history" class="nav-item">
        <span class="nav-icon" aria-hidden="true">↺</span>
        <span>History</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js?v=4.3"></script>
</body>
</html>
